      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0f1d30" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85"/>
  <circle cx="256" cy="256" r="140" fill="#ffffff" opacity="0.08"/>
  <!-- Luther Rose petals hint / White Rose -->
  <g transform="translate(256, 256)">
    <!-- 5 Petals -->
    <path d="M 0,-115 C 32,-115 50,-85 30,-55 C 60,-75 90,-55 85,-20 C 115,-30 125,5 95,25 C 115,55 90,85 60,75 C 65,110 30,120 0,95 C -30,120 -65,110 -60,75 C -90,85 -115,55 -95,25 C -125,5 -115,-30 -85,-20 C -90,-55 -60,-75 -30,-55 C -50,-85 -32,-115 0,-115 Z" fill="#ffffff" opacity="0.95" />
    <!-- Red Heart -->
    <path d="M 0,42 C -40,10 -55,-25 -25,-45 C -5,-55 0,-30 0,-20 C 0,-30 5,-55 25,-45 C 55,-25 40,10 0,42 Z" fill="#dc2626" />
    <!-- Black Cross -->
    <path d="M -5,-35 H 5 V -18 H 17 V -10 H 5 V 22 H -5 V -10 H -17 V -18 H -5 Z" fill="#18181b" />
    <!-- Golden Ring outline -->
    <circle cx="0" cy="0" r="116" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
